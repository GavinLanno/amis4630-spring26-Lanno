name: Deploy API to Azure

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      API_PROJECT: backend/HelloWorldApi/HelloWorldApi.csproj
      API_TEST_PROJECT: backend/HelloWorldApi.Tests/HelloWorldApi.Tests.csproj
      PUBLISH_OUTPUT: ${{ github.workspace }}/api-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ${{ env.API_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.API_PROJECT }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.API_TEST_PROJECT }} --no-build --configuration Release
        continue-on-error: true # remove once you have tests

      - name: Publish
        run: dotnet publish ${{ env.API_PROJECT }} -c Release --no-build -o ${{ env.PUBLISH_OUTPUT }}

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: ${{ env.PUBLISH_OUTPUT }}

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: ./output

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          package: ./output
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
